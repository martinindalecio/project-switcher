<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1712"/>
      <stop offset="1" stop-color="#2a1f17"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- headline -->
  <text x="60" y="110" fill="#f4ede4" font-size="44" font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Every Claude Code</text>
  <text x="60" y="164" fill="#f4ede4" font-size="44" font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">session.</text>
  <text x="60" y="218" fill="#d97757" font-size="44" font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">One pane.</text>
  <text x="60" y="272" fill="#a89a8c" font-size="21" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Grouped by project · context fill at a glance</text>
  <text x="60" y="302" fill="#a89a8c" font-size="21" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">One click resumes it in Claude Desktop.</text>

  <g font-size="17" fill="#cfc4b8">
    <text x="60" y="560"><tspan fill="#d97757">❯</tspan> /projects</text>
    <text x="60" y="600" fill="#7d7268">github.com/martinindalecio/project-switcher</text>
  </g>

  <!-- pane window -->
  <g transform="translate(560,60)" filter="url(#shadow)">
    <rect width="580" height="555" rx="14" fill="#141210" stroke="#3a3029"/>
    <rect width="580" height="40" rx="14" fill="#201b17"/>
    <rect y="26" width="580" height="14" fill="#201b17"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="20" r="6" fill="#febc2e"/>
    <circle cx="62" cy="20" r="6" fill="#28c840"/>
    <text x="290" y="25" fill="#8a7f75" font-size="14" text-anchor="middle">Projects</text>

    <g font-size="16">
      <text x="24" y="78" fill="#8a7f75">3 open · <tspan fill="#e5534b">1 near limit</tspan> · 24 projects</text>
      <text x="556" y="78" fill="#8a7f75" text-anchor="end">↻  ⚙</text>

      <text x="24" y="124" fill="#f4ede4" font-weight="700">Open now</text>

      <!-- row helper: dot, title, bar, pct, age -->
      <text x="34" y="156" fill="#3fb950">●</text>
      <text x="56" y="156" fill="#f4ede4">Fix flaky auth test</text>
      <rect x="330" y="144" width="120" height="12" rx="3" fill="#2c2520"/>
      <rect x="330" y="144" width="103" height="12" rx="3" fill="#e5534b"/>
      <text x="500" y="156" fill="#e5534b" text-anchor="end">86%</text>
      <text x="556" y="156" fill="#8a7f75" text-anchor="end">2m</text>

      <text x="34" y="186" fill="#3fb950">●</text>
      <text x="56" y="186" fill="#f4ede4">Landing page copy</text>
      <rect x="330" y="174" width="120" height="12" rx="3" fill="#2c2520"/>
      <rect x="330" y="174" width="46" height="12" rx="3" fill="#3fb950"/>
      <text x="500" y="186" fill="#cfc4b8" text-anchor="end">38%</text>
      <text x="556" y="186" fill="#8a7f75" text-anchor="end">now</text>

      <text x="34" y="216" fill="#3fb950">●</text>
      <text x="56" y="216" fill="#f4ede4">Stripe webhook retries</text>
      <rect x="330" y="204" width="120" height="12" rx="3" fill="#2c2520"/>
      <rect x="330" y="204" width="77" height="12" rx="3" fill="#d29922"/>
      <text x="500" y="216" fill="#d29922" text-anchor="end">64%</text>
      <text x="556" y="216" fill="#8a7f75" text-anchor="end">5m</text>

      <text x="24" y="264" fill="#f4ede4" font-weight="700">Projects</text>

      <text x="24" y="298" fill="#d97757">▾ webapp <tspan fill="#3fb950">●2</tspan> <tspan fill="#8a7f75">31</tspan></text>
      <rect x="18" y="310" width="544" height="26" rx="5" fill="#2a211b"/>
      <text x="34" y="328" fill="#3fb950">●</text>
      <text x="56" y="328" fill="#f4ede4">Fix flaky auth test</text>
      <rect x="330" y="316" width="120" height="12" rx="3" fill="#2c2520"/>
      <rect x="330" y="316" width="103" height="12" rx="3" fill="#e5534b"/>
      <text x="500" y="328" fill="#e5534b" text-anchor="end">86%</text>
      <text x="556" y="328" fill="#8a7f75" text-anchor="end">2m</text>

      <text x="34" y="358" fill="#8a7f75">○</text>
      <text x="56" y="358" fill="#cfc4b8">Migrate to the new router</text>
      <rect x="330" y="346" width="120" height="12" rx="3" fill="#2c2520"/>
      <rect x="330" y="346" width="62" height="12" rx="3" fill="#3fb950"/>
      <text x="500" y="358" fill="#cfc4b8" text-anchor="end">52%</text>
      <text x="556" y="358" fill="#8a7f75" text-anchor="end">1d</text>

      <text x="56" y="388" fill="#8a7f75">+2 more</text>

      <text x="24" y="428" fill="#d97757">▾ api <tspan fill="#3fb950">●1</tspan> <tspan fill="#8a7f75">12</tspan></text>
      <text x="34" y="458" fill="#3fb950">●</text>
      <text x="56" y="458" fill="#f4ede4">Stripe webhook retries</text>
      <rect x="330" y="446" width="120" height="12" rx="3" fill="#2c2520"/>
      <rect x="330" y="446" width="77" height="12" rx="3" fill="#d29922"/>
      <text x="500" y="458" fill="#d29922" text-anchor="end">64%</text>
      <text x="556" y="458" fill="#8a7f75" text-anchor="end">5m</text>

      <text x="24" y="498" fill="#d97757">▸ infra <tspan fill="#8a7f75">7</tspan></text>
      <text x="24" y="528" fill="#d97757">▸ blog <tspan fill="#8a7f75">4</tspan></text>
    </g>
  </g>
</svg>
